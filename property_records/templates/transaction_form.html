{% extends "base.html" %}

{% block title %}New Transaction - Property Records{% endblock %}

{% block header_title %}Record New Transaction{% endblock %}

{% block content %}
<form method="POST" class="bg-white rounded-xl shadow-sm p-6 max-w-3xl">
    <div class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Transaction Type *</label>
            <select name="transaction_type" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">Select Type</option>
                {% for tt in transaction_types %}
                <option value="{{ tt }}">{{ tt }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Property *</label>
            <select name="property_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">Select Property</option>
                {% for property in properties %}
                <option value="{{ property.id }}">{{ property.property_number }} - {{ property.county }}, {{ property.state }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Seller/Transferor</label>
                <select name="seller_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Owner</option>
                    {% for owner in owners %}
                    <option value="{{ owner.id }}">{{ owner.name }} ({{ owner.owner_type }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Buyer/Transferee</label>
                <select name="buyer_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Owner</option>
                    {% for owner in owners %}
                    <option value="{{ owner.id }}">{{ owner.name }} ({{ owner.owner_type }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Transaction Amount (SSP)</label>
                <input type="number" step="0.01" name="transaction_amount" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
                <select name="payment_method" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">Select Method</option>
                    <option value="Cash">Cash</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Mobile Money">Mobile Money</option>
                    <option value="Check">Check</option>
                </select>
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Deed Number</label>
            <input type="text" name="deed_number" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Stamp Duty Paid (SSP)</label>
                <input type="number" step="0.01" name="stamp_duty_paid" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Registration Fee (SSP)</label>
                <input type="number" step="0.01" name="registration_fee" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Remarks/Notes</label>
            <textarea name="remarks" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
    </div>
    
    <div class="mt-6 flex gap-4">
        <button type="submit" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium">
            <i class="fas fa-save mr-2"></i> Record Transaction
        </button>
        <a href="{{ url_for('transactions') }}" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium">
            <i class="fas fa-times mr-2"></i> Cancel
        </a>
    </div>
</form>
{% endblock %}
