{% extends "base.html" %}

{% block title %}Login - Property Records{% endblock %}

{% block login_content %}
<div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-900 rounded-full mb-4">
            <i class="fas fa-building text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Property Records System</h1>
        <p class="text-gray-600 mt-2">Republic of South Sudan</p>
    </div>
    
    <form method="POST" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
            <input type="text" id="username" name="username" required 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter your username">
        </div>
        
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input type="password" id="password" name="password" required 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter your password">
        </div>
        
        <button type="submit" 
                class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition-colors">
            <i class="fas fa-sign-in-alt mr-2"></i> Sign In
        </button>
    </form>
    
    <div class="mt-6 p-4 bg-gray-50 rounded-lg">
        <p class="text-xs text-gray-600 font-medium mb-2">Demo Credentials:</p>
        <p class="text-xs text-gray-500">Username: <code class="bg-gray-200 px-2 py-1 rounded">admin</code></p>
        <p class="text-xs text-gray-500">Password: <code class="bg-gray-200 px-2 py-1 rounded">password123</code></p>
    </div>
</div>
{% endblock %}
