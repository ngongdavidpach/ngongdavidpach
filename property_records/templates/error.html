{% extends "base.html" %}

{% block title %}Error - Property Records{% endblock %}

{% block login_content %}
<div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 bg-red-100 rounded-full mb-6">
        <i class="fas fa-exclamation-triangle text-red-600 text-4xl"></i>
    </div>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Error</h1>
    <p class="text-gray-600 mb-6">{{ error }}</p>
    <a href="{{ url_for('login') }}" 
       class="inline-block px-6 py-3 bg-blue-900 text-white rounded-lg hover:bg-blue-800">
        <i class="fas fa-arrow-left mr-2"></i> Back to Login
    </a>
</div>
{% endblock %}
